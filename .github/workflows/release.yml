name: Validate and package InkGroove

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inkgroove-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: inkgroove_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-password"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ctype, curl, dom, fileinfo, intl, mbstring, pdo_mysql, pdo_sqlite, xml, zip
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm test
      - name: Install Chromium for editor regressions
        run: npx playwright install --with-deps chromium
      - name: Check native composition and bilingual editor
        run: npm run test:browser
      - run: php vendor/bin/phpunit
      - name: Prepare disposable certificate JSON database
        env:
          CI_MYSQL_ROOT_PASSWORD: ci-only-password
        run: |
          php <<'PHP'
          <?php
          $db = new PDO('mysql:host=127.0.0.1;port=3306', 'root', getenv('CI_MYSQL_ROOT_PASSWORD'), [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
          $version = $db->getAttribute(PDO::ATTR_SERVER_VERSION);
          if (!preg_match('/^8\.4\./', $version)) throw new RuntimeException('MySQL 8.4 required');
          $password = bin2hex(random_bytes(32));
          echo "::add-mask::$password\n";
          $db->exec('CREATE DATABASE m34i_synthetic');
          $db->exec("CREATE USER 'm34i_runner'@'%' IDENTIFIED BY ".$db->quote($password));
          $db->exec("GRANT CREATE TEMPORARY TABLES ON m34i_synthetic.* TO 'm34i_runner'@'%'");
          file_put_contents(getenv('GITHUB_ENV'), "M34I_MYSQL_PASSWORD=$password\n", FILE_APPEND);
          PHP
      - name: Require certificate signatures after MySQL 8.4 JSON round-trip
        env:
          M34I_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=m34i_synthetic
          M34I_MYSQL_USER: m34i_runner
          M34I_MYSQL_REQUIRE_84: '1'
        # No skip conversion or continue-on-error: exit 77 must fail validate too.
        run: php tests/integration/certificate-json-roundtrip.php
      - run: python3 -m unittest discover -s tests/deployment -v
      - name: Verify migrations and empty documents on real MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: inkgroove_ci
          DB_USERNAME: root
          DB_PASSWORD: ci-only-password
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          VERITAS_SIGNING_KEY: ci-signing-key-for-smoke-test-only
        run: |
          php artisan migrate --force
          php scripts/check-mysql-release.php
      - run: sh scripts/package-siteground.sh releases
      - run: sh scripts/package-alpine.sh releases
      - name: Boot Docker from the Alpine release package
        env:
          INKGROOVE_DOCKER_SMOKE_CI: '1'
          DB_DATABASE: inkgroove_ci
          DB_USERNAME: root
          DB_PASSWORD: ci-only-password
        run: sh scripts/check-alpine-runtime.sh "releases/inkgroove-alpine-$(printf '%.12s' "$GITHUB_SHA").zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: |
            releases/*.zip
            releases/*.zip.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: releases
      - name: Publish complete, versioned private release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -eu
          tag="build-$(printf '%.12s' "$REVISION")"
          if gh release view "$tag" --json isDraft --jq .isDraft >/tmp/draft 2>/dev/null; then
            if [ "$(cat /tmp/draft)" = false ]; then
              echo "This immutable build is already published."
              exit 0
            fi
          else
            gh release create "$tag" --target "$REVISION" --draft --prerelease --title "InkGroove $tag" --notes "Validated PHP/frontend/MySQL tests and packaged Docker runtime startup. Revision: $REVISION. Separate packages for SiteGround and Alpine."
          fi
          gh release upload "$tag" releases/*.zip releases/*.zip.sha256 --clobber
          gh release edit "$tag" --draft=false
