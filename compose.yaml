services:
  app:
    image: veritas-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: veritas-app
    restart: unless-stopped
    environment:
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-veritas}
      DB_USERNAME: ${DB_USERNAME:-veritas}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in .env}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
    ports:
      - "${VERITAS_PORT:-8080}:80"
    volumes:
      - ./data/app:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.4
    container_name: veritas-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-veritas}
      MARIADB_USER: ${DB_USERNAME:-veritas}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD in .env}
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
